version: 2
application: postgres
description: |
  PostgreSQL is a powerful, open source object-relational database system that uses and extends the SQL language combined with many features that safely store and scale the most complicated data workloads.

  PostgreSQL has a rich ecosystem of extensions.

  Within a major version, PostgreSQL provides excellent forward and backward compatibility.

  Development of PostgreSQL is directed and driven by its community.
website: https://www.postgresql.org/
issues: https://github.com/canonical/postgresql-rock/issues
source-code: https://github.com/canonical/postgresql-rock

docker:
  parameters: >-
    -d
    -p 5432:5432
    --volume mypgdata:/var/lib/postgresql/
    --mount type=bind,source="$PWD/postgres_password.txt",destination=/run/secrets/postgres_password,readonly
  run_conclusion: |
    Access your PostgreSQL server at `localhost:5432`.

config:
  '`-v <path>:/var/lib/postgresql`':
    type: mount
    description: Persist database data. Required to avoid data loss.
  '`--mount type=bind,source=<path>,destination=/run/secrets/postgres_password,readonly`':
    type: mount
    description: "File containing `postgres` user password. File owner and group must be `584792`. File mode (permissions) must be `400`. Example generation: `tr -dc 'A-Za-z0-9' < /dev/urandom \\| head -c 24 \\| tee postgres_password.txt`"
  '`-v <path>:/etc/postgresql/postgresql.conf`':
    type: mount
    description: PostgreSQL [configuration file](https://www.postgresql.org/docs/current/config-setting.html#CONFIG-SETTING-CONFIGURATION-FILE)
  '`-p <port>:5432`':
    type: port
    description: Expose the container's port `5432` on the host's `<port>`.
  '`--args postgres -c <parameter_name>=<parameter_value>`':
    type: app
    description: Pass [parameter setting(s)](https://www.postgresql.org/docs/current/config-setting.html#CONFIG-SETTING-SHELL) to `postgres` server
  '`--args initdb <option>`':
    type: app
    description: Pass [`initdb` options](https://www.postgresql.org/docs/current/app-initdb.html). `initdb` is only run if the data directory does not already exist
