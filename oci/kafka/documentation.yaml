version: 2
application: kafka
description: |
  Apache Kafka is an open-source distributed event streaming platform for
  high-performance data pipelines, streaming analytics and integrations.

  Receives security updates and tracks the newest combination of Apache 
  Kafka and Ubuntu. **This repository is free to use and exempted from 
  per-user rate limits.**

  # Apache Kafka 3 Quickstart
  To deploy a single-broker containerized Kafka, you need to first 
  deploy the ZooKeeper service and make sure that the ZooKeeper service is 
  reachable by Kafka. 
  
  First, create a network 
  
  ```bash 
  docker network create -d bridge kafka-network
  ```
  
  Deploy the ZooKeeper service
  
  ```bash 
  docker run --detach  --name zookeeper --network kafka-network ubuntu/zookeeper:3.8-22.04_edge
  ```
  
  Finally, deploy the Kafka service
  
  ```
  docker run --detach --name kafka --network kafka-network -p 9092:9092 ubuntu/kafka:3.9-22.04_edge
  ```

  # Apache Kafka 4 Quickstart
  To deploy a single-broker containerized Kafka, create a network first:
  
  ```bash 
  docker network create -d bridge kafka-network
  ```

  Now, deploy the Apache Kafka service
  
  ```
  docker run --detach \
    --name kafka \
    --network kafka-network \
    -p 9092:9092 \
    ubuntu/kafka:4.1-24.04_edge
  ```

  To activate the Apache Kafka service, you need to format the logs directory
  and grant its ownership to the `kafka` user:

  ```
  docker exec kafka \
    /opt/kafka/bin/kafka-storage.sh format \
    --standalone \
    --cluster-id $(cat /proc/sys/kernel/random/uuid | tr -d '-' | base64 | cut -b 1-22) \
    -c /etc/kafka/server.properties

  docker exec kafka chown -R kafka:kafka /tmp/kraft-combined-logs/
  ````

  # Apache Kafka 4.3+ Quickstart (KRaft rock)
  From `4.3-26.04` onward the image ships a working single-node broker. A bare
  run generates a cluster id, formats the KRaft storage and starts the broker
  on `9092`, with no manual format step:

  ```
  docker run --detach --name kafka -p 9092:9092 ubuntu/kafka:4.3-26.04_edge
  ```

  Configure the broker by passing `KAFKA_*` environment variables. Each maps to
  the matching `server.properties` key, upper-snake-case to lower-dotted, so
  `KAFKA_NUM_PARTITIONS` sets `num.partitions`:

  ```
  docker run --detach --name kafka -p 9092:9092 \
    -e KAFKA_NUM_PARTITIONS=3 \
    -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
    ubuntu/kafka:4.3-26.04_edge
  ```

  The broker runs as an idiomatic Pebble service with a readiness check on the
  configured listener port. See the `KAFKA_*` config options below for the full
  configuration interface, and the source repository for clustering.

  Please note that the images tagged up to 3.1 are Dockerfile-base images,
  whereas from version 3.6.1 onward the images are now rocks.
website: https://kafka.apache.org
issues: https://github.com/canonical/kafka-artifacts/issues
source-code: https://github.com/canonical/kafka-artifacts

docker:
  parameters: >-
    -p 9092:9092
  run_conclusion: |
    Access the Apache Kafka server at `localhost:9092`.
  legacy:
    parameters: >- 
      -p 9092:9092
    run_conclusion: |
      Access the Apache Kafka server at `localhost:9092`.

config:
  '`TZ`':
    type: env
    description: Configure the container timezone value.
    default: 'UTC'
  '`ZOOKEEPER_HOST`':
    type: env
    description: Hostname for the related Zookeeper instance. Only used in Apache Kafka 3.
    default: 'zookeeper'
  '`ZOOKEEPER_PORT`':
    type: env
    description: Port for the related Zookeeper instance. Only used in Apache Kafka 3.
    default: '2181'
  '`JAVA_HOME`':
    type: env
    description: Directory in which Java is installed.
    default: '/usr/lib/jvm/java-18-openjdk-amd64'
  '`-v <path>:/etc/kafka/server.properties`':
    type: mount
    description: Override Kafka server configuration file.
  '`-v <path>:/var/lib/kafka`':
    type: mount
    description: >-
      Persist data mounted inside the container. 
      The mount point should be consistent with the configuration property `logs.dirs`.
  '`-p <port>:9092`':
    type: port
    description: Expose the container's port `9092` on the host's `<port>`.
  '`KAFKA_<PROPERTY>`':
    type: env
    description: >-
      Any variable of this form is folded into `server.properties`, mapping
      upper-snake-case to the lower-dotted key (`KAFKA_NUM_PARTITIONS` sets
      `num.partitions`). Only used in the Apache Kafka 4.3+ rock.
  '`CLUSTER_ID`':
    type: env
    description: >-
      KRaft cluster id used to format the storage on first start.
      Only used in the Apache Kafka 4.3+ rock.
    default: 'a generated random UUID'
  '`KAFKA_PROCESS_ROLES`':
    type: env
    description: >-
      KRaft roles for the node, e.g. `broker,controller` or `controller` for a
      controller-only node. Only used in the Apache Kafka 4.3+ rock.
  '`KAFKA_LISTENERS`':
    type: env
    description: >-
      Listeners the broker binds. Derived from `KAFKA_ADVERTISED_LISTENERS` when
      only the latter is set. Only used in the Apache Kafka 4.3+ rock.
  '`KAFKA_ADVERTISED_LISTENERS`':
    type: env
    description: Listeners advertised to clients. Only used in the Apache Kafka 4.3+ rock.
  '`TRACE`':
    type: env
    description: >-
      Set to `true` to trace the start script. May expose credentials in the
      logs. Only used in the Apache Kafka 4.3+ rock.
    default: 'false'
  '`-v <path>:/mnt/shared/config`':
    type: mount
    description: >-
      Config files folded into the rendered `server.properties` at start-up.
      Only used in the Apache Kafka 4.3+ rock.
  '`-v <path>:/var/lib/kafka/data`':
    type: mount
    description: >-
      Persist the KRaft data directory (`log.dirs`).
      Only used in the Apache Kafka 4.3+ rock.
  '`-v <path>:/var/lib/kafka/plugins/broker`':
    type: mount
    description: >-
      Side-load jars (authorizers, metric reporters, etc.) onto the broker
      classpath. Only used in the Apache Kafka 4.3+ rock.
  '`-v <path>:/etc/kafka/secrets`':
    type: mount
    description: >-
      TLS keystores and truststores. Only used in the Apache Kafka 4.3+ rock.
